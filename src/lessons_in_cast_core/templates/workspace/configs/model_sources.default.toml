# Default runtime model registry.
#
# Copy this file to `configs/model_sources.toml` and define the models available
# in the local workspace. Voice profiles reference these entries by model ID. The
# populated local file is intentionally ignored by Git because model choices and
# paths are machine-specific.

[models]

# Example:
#
# [models.example]
# path = "models/provider/repository" # omit for hosted API models
# provider = "huggingface"
# repository = "provider/repository"
# revision = "pinned-revision"
# license = "license-identifier"
