# Character mapping for the current game release.
# Each speaker ID used by the game needs an entry. Leave default_voice_profile
# empty to keep a character as context only; point it at a profile entrypoint
# under profiles/ to voice it.
#
# Context-specific fields use this hierarchy and inherit from their parent:
# [characters.<id>."relative/source/path.rpy".<nearest_label>.<nearest_scene>]
# Missing label or scene context truncates matching at the preceding level.

[characters.narrator]
name = "Narrator"
definition_path = "renpy/common/00definitions.rpy"
definition_line = 1
built_in = true
default_voice_profile = ""

