name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Git Bash on Windows, so every step behaves the same on both platforms.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The effects chain needs FFmpeg >= 6 with libopus; FFmpeg tests are
      # skipped rather than failed when it is missing, so install it explicitly.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Show FFmpeg version
        run: ffmpeg -hide_banner -version

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -ra

  package:
    name: Build and smoke-test package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          "$bin/python" -m pip install dist/*.whl
          echo "$bin" >> "$GITHUB_PATH"

      - name: Initialize and validate a workspace
        working-directory: ${{ runner.temp }}
        run: |
          mkdir workspace && cd workspace
          lessons-in-cast init
          lessons-in-cast check-config
          lessons-in-cast-effects --help > /dev/null
          lessons-in-cast-audition --help > /dev/null
          lessons-in-cast-voice-design --help > /dev/null

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dist
          path: dist/
          if-no-files-found: error
